services:
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis-app
    networks:
      - backend
    volumes:
      - ${REDIS_DATA_STORAGE_NAME}:/data
    restart: unless-stopped
  api:
    image: alpine
    container_name: alpine-app
    command: sleep infinity
    networks:
      - backend
      - frontend
    depends_on:
      - redis
  proxy:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${PROXY_EXT_PORT}:80"
    networks:
      - frontend
    depends_on:
      - api

networks:
  backend:
  frontend:
volumes:
  redisdata: